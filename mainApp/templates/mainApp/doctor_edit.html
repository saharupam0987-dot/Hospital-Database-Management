
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Doctor</title>
</head>
<body>
    <h1>Edit Doctor</h1>

    <p>Doctor ID: {{ doctor.id }}</p>

    <form method="POST">
        {% csrf_token %}

        <label for="name">Doctor Name:</label><br>
        <input
            type="text"
            id="name"
            name="name"
            value="{{ doctor.name }}"
            maxlength="100"
            required
        >
        <br><br>

        <label for="department">Department:</label><br>
        <input
            type="text"
            id="department"
            name="department"
            value="{{ doctor.department }}"
            maxlength="20"
            required
        >
        <br><br>

        <label for="officeNumber">Office Number:</label><br>
        <input
            type="text"
            id="officeNumber"
            name="officeNumber"
            value="{{ doctor.officeNumber }}"
            maxlength="10"
            required
        >
        <br><br>

        <label for="phoneNumber">Phone Number:</label><br>
        <input
            type="tel"
            id="phoneNumber"
            name="phoneNumber"
            value="{{ doctor.phoneNumber|default_if_none:'' }}"
            maxlength="20"
        >
        <br><br>

        <label for="email">Email:</label><br>
        <input
            type="email"
            id="email"
            name="email"
            value="{{ doctor.email|default_if_none:'' }}"
            maxlength="254"
        >
        <br><br>

        <label for="address">Address:</label><br>
        <textarea
            id="address"
            name="address"
            maxlength="100"
            rows="3"
        >{{ doctor.address|default_if_none:'' }}</textarea>
        <br><br>

        <button type="submit">Save Changes</button>
    </form>

    <br>
    <a href="{% url 'doctor_list' %}">Back to Doctor List</a>
</body>
</html>
