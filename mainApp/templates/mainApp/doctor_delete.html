
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Doctor</title>
</head>
<body>
    <h1>Delete Doctor</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ doctor.name }}</strong>?
    </p>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% else %}
        <p>This action cannot be undone.</p>

        <form method="POST">
            {% csrf_token %}
            <button type="submit">Yes, Delete Doctor</button>
        </form>
    {% endif %}

    <br>
    <a href="{% url 'doctor_list' %}">Cancel and Go Back</a>
</body>
</html>
