
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Doctor</title>
</head>
<body>
    <h1>Add New Doctor</h1>

    <form method="POST">
        {% csrf_token %}

        <label for="name">Doctor Name:</label><br>
        <input type="text" id="name" name="name" maxlength="100" required>
        <br><br>

        <label for="department">Department:</label><br>
        <input
            type="text"
            id="department"
            name="department"
            maxlength="20"
            required
        >
        <br><br>

        <label for="officeNumber">Office Number:</label><br>
        <input
            type="text"
            id="officeNumber"
            name="officeNumber"
            maxlength="10"
            required
        >
        <br><br>

        <label for="phoneNumber">Phone Number:</label><br>
        <input type="tel" id="phoneNumber" name="phoneNumber" maxlength="20">
        <br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" maxlength="254">
        <br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" maxlength="100" rows="3"></textarea>
        <br><br>

        <button type="submit">Create Doctor</button>
    </form>

    <br>
    <a href="{% url 'doctor_list' %}">Back to Doctor List</a>
</body>
</html>
