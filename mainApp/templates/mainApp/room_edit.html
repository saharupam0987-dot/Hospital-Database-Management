
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Hospital Room</title>
</head>
<body>
    <h1>Edit Room</h1>

    <p>Room ID: {{ room.id }}</p>

    <form method="POST">
        {% csrf_token %}

        <label for="type">Room Type:</label><br>
        <input
            type="text"
            id="type"
            name="type"
            value="{{ room.type }}"
            maxlength="10"
            required
        >
        <br><br>

        <button type="submit">Save Changes</button>
    </form>

    <br>
    <a href="{% url 'room_list' %}">Back to Room List</a>
</body>
</html>
