<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Test</title>
</head>
<body>

    <h1>Delete Test</h1>

    <p>
        Are you sure you want to delete this test?
    </p>

    <p>
        <strong>Test Name:</strong> {{ test.testName }}
    </p>

    <p>
        <strong>Patient:</strong> {{ test.patientID.name }}
    </p>

    <p>
        <strong>Scheduled Time:</strong> {{ test.scheduledTime }}
    </p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete Test</button>
    </form>

    <br>

    <a href="{% url 'test_list' %}">Cancel</a>

</body>
</html>
