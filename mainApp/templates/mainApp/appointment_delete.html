<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Appointment</title>
</head>
<body>

    <h1>Delete Appointment</h1>

    <p>
        Are you sure you want to delete this appointment?
    </p>

    <p>
        <strong>Patient:</strong> {{ appointment.patientID.name }}
    </p>

    <p>
        <strong>Doctor:</strong> {{ appointment.doctorID.name }}
    </p>

    <p>
        <strong>Start Time:</strong> {{ appointment.startTime }}
    </p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete Appointment</button>
    </form>

    <br>

    <a href="{% url 'appointment_list' %}">Cancel</a>

</body>
</html>
