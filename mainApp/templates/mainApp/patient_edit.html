<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Patient</title>
</head>
<body>

    <h1>Edit Patient</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Name:</label><br>
        <input type="text" name="name" value="{{ patient.name }}" required>
        <br><br>

        <label>Date of Birth:</label><br>
        <input type="date" name="dob" value="{{ patient.dob|date:'Y-m-d' }}">
        <br><br>

        <label>Gender:</label><br>
        <select name="gender">
            <option value="">Select Gender</option>
            <option value="Male" {% if patient.gender == "Male" %}selected{% endif %}>Male</option>
            <option value="Female" {% if patient.gender == "Female" %}selected{% endif %}>Female</option>
            <option value="Other" {% if patient.gender == "Other" %}selected{% endif %}>Other</option>
        </select>
        <br><br>

        <label>Address:</label><br>
        <input type="text" name="address" value="{{ patient.address|default:'' }}">
        <br><br>

        <label>Phone Number:</label><br>
        <input type="text" name="phoneNumber" value="{{ patient.phoneNumber|default:'' }}">
        <br><br>

        <label>Email:</label><br>
        <input type="email" name="email" value="{{ patient.email|default:'' }}">
        <br><br>

        <button type="submit">Save Changes</button>
    </form>

    <br>

    <a href="{% url 'patient_list' %}">Back to Patient List</a>

</body>
</html>
