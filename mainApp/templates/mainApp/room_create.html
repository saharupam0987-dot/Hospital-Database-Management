
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Hospital Room</title>
</head>
<body>
    <h1>Add New Room</h1>

    <form method="POST">
        {% csrf_token %}

        <label for="type">Room Type:</label><br>
        <input
            type="text"
            id="type"
            name="type"
            maxlength="10"
            placeholder="e.g. General"
            required
        >
        <br><br>

        

        <button type="submit">Create Room</button>
    </form>

    <br>
    <a href="{% url 'room_list' %}">Back to Room List</a>
</body>
</html>
