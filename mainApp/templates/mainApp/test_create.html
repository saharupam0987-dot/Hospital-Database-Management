<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Test</title>
</head>

<body>

    <h1>Add New Test</h1>

    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Test Name:</label><br>
        <input type="text" name="testName" required>

        <br><br>

        <label>Patient:</label><br>
        <select name="patientID" required>
            <option value="">Select Patient</option>

            {% for patient in patients %}
            <option value="{{ patient.id }}">
                {{ patient.name }}
            </option>
            {% endfor %}
        </select>

        <br><br>

        <label>Scheduled Time:</label><br>
        <input type="datetime-local" name="scheduledTime" required>

        <br><br>

        <label>Report Generation Time:</label><br>
        <input type="datetime-local" name="reportGenerationTime" required>

        <br><br>

        <label>Test Report:</label><br>
        <input type="file" name="testReport">

        <br><br>

        <button type="submit">Create Test</button>
    </form>

    <br>

    <a href="{% url 'test_list' %}">Back to Test List</a>

</body>

</html>
