
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Admission</title>
</head>

<body>

    <h1>Edit Admission</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Patient:</label><br>
        <select name="patientID" required>
            {% for patient in patients %}
                <option
                    value="{{ patient.id }}"
                    {% if patient.id == admission.patientID.id %}selected{% endif %}
                >
                    {{ patient.name }}
                </option>
            {% endfor %}
        </select>

        <br><br>

        <label>Room:</label><br>
        <select name="roomID" required>
            {% for room in rooms %}
                <option
                    value="{{ room.id }}"
                    {% if room.id == admission.roomID.id %}selected{% endif %}
                >
                    Room {{ room.id }} - {{ room.type }}
                </option>
            {% endfor %}
        </select>

        <br><br>

        <label>Admission Time:</label><br>
        <input
            type="datetime-local"
            name="startTime"
            value="{{ admission.startTime|date:'Y-m-d\TH:i' }}"
            required
        >

        <br><br>

        <label>Discharge Time:</label><br>
        <input
            type="datetime-local"
            name="endTime"
            value="{% if admission.endTime %}{{ admission.endTime|date:'Y-m-d\TH:i' }}{% endif %}"
        >

        <br><br>

        <button type="submit">Save Changes</button>
    </form>

    <br>

    <a href="{% url 'admission_list' %}">Back to Admission List</a>

</body>
</html>
