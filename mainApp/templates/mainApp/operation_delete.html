
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Operation</title>
</head>
<body>
    <h1>Delete Operation</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ operation.opName }}</strong>?
    </p>

    <p>This action cannot be undone.</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete Operation</button>
    </form>

    <br>
    <a href="{% url 'operation_list' %}">Cancel and Go Back</a>
</body>
</html>
