<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Admission</title>
</head>

<body>

    <h1>Add New Admission</h1>

    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Patient:</label><br>
        <select name="patientID" required>
            <option value="">Select Patient</option>

            {% for patient in patients %}
            <option value="{{ patient.id }}">
                {{ patient.name }}
            </option>
            {% endfor %}
        </select>

        <br><br>

        <label>Room:</label><br>
        <select name="roomID" required>
            <option value="">Select Room</option>

            {% for room in rooms %}
            <option value="{{ room.id }}">
                Room {{ room.id }} - {{ room.type }}
            </option>
            {% endfor %}
        </select>

        <br><br>

        <label>Admission Time:</label><br>
        <input type="datetime-local" name="startTime" required>

        <br><br>

        <label>Discharge Time:</label><br>
        <input type="datetime-local" name="endTime">

        <br><br>

        <button type="submit">Create Admission</button>
    </form>

    <br>

    <a href="{% url 'admission_list' %}">Back to Admission List</a>

</body>

</html>
