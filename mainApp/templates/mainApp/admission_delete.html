<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Admission</title>
</head>
<body>

    <h1>Delete Admission</h1>

    <p>
        Are you sure you want to delete this admission?
    </p>

    <p>
        <strong>Patient:</strong> {{ admission.patientID.name }}
    </p>

    <p>
        <strong>Room:</strong> {{ admission.roomID.id }}
    </p>

    <p>
        <strong>Admission Time:</strong> {{ admission.startTime }}
    </p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete Admission</button>
    </form>

    <br>

    <a href="{% url 'admission_list' %}">Cancel</a>

</body>
</html>
